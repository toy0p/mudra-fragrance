{% extends "website/base.html" %}
{% block title %}Log in | MUDRA Fragrance{% endblock %}
{% block content %}
<main class="simple-page">
    <h1>Log in</h1>
    <form method="post" class="simple-card auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="simple-button" type="submit">LOG IN</button>
    </form>
    <p>New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
</main>
<style>
.simple-page{max-width:560px;margin:0 auto;padding:55px 24px 90px}.simple-page h1{font:400 48px Georgia,serif;margin-bottom:28px}.simple-card{background:#f5f5f3;padding:28px}.auth-form p{margin:0 0 18px}.auth-form label{display:block;margin-bottom:7px}.auth-form input{width:100%;min-height:42px;padding:9px;border:1px solid #bbb;background:#fff}.auth-form ul,.auth-form .helptext{color:#666;font-size:12px}.simple-button{border:0;background:#111;color:#fff;padding:14px 24px;cursor:pointer;letter-spacing:.1em}.simple-page>a,.simple-page p a{text-decoration:underline}
@media(max-width:600px){.simple-page{padding:35px 16px 65px}.simple-page h1{font-size:38px}}
</style>
{% endblock %}
